<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>D2I Cloud · 结果库</title>
<link id="d2iThemeStyles" rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">D2I</div>
        <div>
          <div class="brand-title">D2I Cloud</div>
          <div class="brand-sub">采集控制台</div>
        </div>
      </div>

      <nav class="side-nav">
        <a class="nav-item" href="/">
          <span class="nav-ico"></span>
          队列运行中心
        </a>
        <a class="nav-item" href="/vision">
          <span class="nav-ico"></span>
          视觉任务
        </a>
        <a class="nav-item" href="/coverage">
          <span class="nav-ico"></span>
          覆盖图谱
        </a>
        <a class="nav-item active" href="/library">
          <span class="nav-ico"></span>
          结果库
        </a>
        <a class="nav-item disabled" title="后续版本">
          <span class="nav-ico"></span>
          模板经验
        </a>
        <a class="nav-item disabled" title="后续版本">
          <span class="nav-ico"></span>
          设置与连接
        </a>
      </nav>

      <div class="side-foot">
        <div class="conn-row">
          <span id="connDot" class="dot"></span>
          <span id="connText">连接中…</span>
        </div>
      </div>
    </aside>

    <div class="main-column">
      <header class="page-header">
        <div>
          <div class="eyebrow">Result Library</div>
          <h1>结果库</h1>
          <p class="page-sub">跨队列浏览已落盘结果；预览复用队列条目接口，不扫整库肖像盘。</p>
        </div>
        <div class="header-actions">
          <button type="button" id="btnRefresh" class="btn">刷新</button>
        </div>
      </header>

      <section class="overview-strip" id="overviewStrip">
        <article class="stat-card">
          <div class="stat-label">条目总数</div>
          <div class="stat-value" id="statTotal">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">可预览</div>
          <div class="stat-value accent" id="statPreviewable">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">参与队列</div>
          <div class="stat-value" id="statQueues">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">当前页</div>
          <div class="stat-value sm" id="statPage">—</div>
        </article>
      </section>

      <section class="workspace library-workspace">
        <div class="queue-column library-filters">
          <div class="section-bar">
            <h2>筛选</h2>
          </div>
          <div class="card library-filter-card">
            <label class="field">
              <span>关键词</span>
              <input id="searchInput" type="search" placeholder="姓名 / 路径 / 队列 / URL" />
            </label>
            <label class="field">
              <span>队列</span>
              <select id="queueFilter">
                <option value="">全部队列</option>
              </select>
            </label>
            <div class="field">
              <span>状态</span>
              <div class="filter-pills" id="statusPills">
                <button type="button" class="pill active" data-status="all">全部</button>
                <button type="button" class="pill" data-status="image">有图</button>
                <button type="button" class="pill" data-status="done">完成</button>
                <button type="button" class="pill" data-status="pending">未完成</button>
              </div>
            </div>
            <div class="library-filter-actions">
              <button type="button" class="btn primary" id="btnApplyFilters">应用筛选</button>
              <button type="button" class="btn ghost" id="btnResetFilters">重置</button>
            </div>
            <p class="muted-hint" id="filterHint">默认优先展示有图结果。</p>
            <div class="library-queue-list" id="queueSummary"></div>
          </div>
        </div>

        <div class="detail-column library-main">
          <div class="card results-card library-results-card">
            <div class="card-head results-head">
              <div>
                <h3>跨队列结果</h3>
                <span class="muted" id="itemsHint">加载中…</span>
              </div>
              <div class="results-toolbar">
                <button type="button" class="btn ghost sm" id="btnPrevPage" disabled>上一页</button>
                <button type="button" class="btn ghost sm" id="btnNextPage" disabled>下一页</button>
              </div>
            </div>
            <div class="results-layout">
              <div class="item-grid" id="itemGrid">
                <div class="empty-state" style="grid-column:1/-1">正在加载结果库…</div>
              </div>
              <aside class="item-side" id="itemSide">
                <div class="item-side-empty" id="itemSideEmpty">
                  <div class="empty-illustration sm"></div>
                  <h4>选择一张结果</h4>
                  <p>查看所属队列、落盘路径、状态与来源页。</p>
                </div>
                <div class="item-side-body" id="itemSideBody" hidden>
                  <div class="item-side-preview-wrap">
                    <img id="itemSidePreview" alt="预览" hidden />
                    <div class="item-side-preview-fallback" id="itemSideFallback">无本地预览</div>
                  </div>
                  <h4 id="itemSideName">—</h4>
                  <div class="item-side-tags" id="itemSideTags"></div>
                  <dl class="meta-grid compact" id="itemSideMeta"></dl>
                  <div class="item-side-actions">
                    <button type="button" class="btn sm" id="btnOpenLightbox" disabled>放大查看</button>
                    <a class="btn sm ghost" id="itemSideQueue" href="#" hidden>打开队列</a>
                    <a class="btn sm ghost" id="itemSideSource" href="#" target="_blank" rel="noopener" hidden>来源页</a>
                  </div>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
<dialog id="lightboxDialog" class="lightbox">
    <div class="lightbox-shell">
      <div class="lightbox-top">
        <div>
          <div class="eyebrow">Preview</div>
          <h3 id="lightboxTitle">—</h3>
        </div>
        <div class="lightbox-actions">
          <button type="button" class="btn ghost sm" id="btnLightboxPrev">上一张</button>
          <button type="button" class="btn ghost sm" id="btnLightboxNext">下一张</button>
          <button type="button" class="icon-btn" id="btnLightboxClose" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
      </div>
      <div class="lightbox-stage">
        <img id="lightboxImage" alt="大图预览" />
        <div class="lightbox-empty" id="lightboxEmpty" hidden>当前项没有可预览的本地图片。</div>
      </div>
      <p class="lightbox-meta" id="lightboxMeta">—</p>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script>
    /* Inline gate probe: runs even if /static/*.js is replaced by Access HTML */
    (function () {
      function setConn(ok, text) {
        var dot = document.getElementById("connDot");
        var label = document.getElementById("connText");
        if (dot) dot.className = "dot " + (ok ? "ok" : "bad");
        if (label) label.textContent = text;
      }
      function looksAccess(text, ct) {
        text = String(text || "");
        ct = String(ct || "").toLowerCase();
        return (ct.indexOf("text/html") >= 0 || /<html/i.test(text)) &&
          /cloudflare\s*access|cloudflareaccess\.com|Sign in/i.test(text);
      }
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = setTimeout(function () {
        if (ctrl) ctrl.abort();
        var cur = (document.getElementById("connText") || {}).textContent || "";
        if (cur.indexOf("连接中") >= 0) setConn(false, "连接超时：请检查网络或 Access 登录");
      }, 10000);
      fetch("/api/v1/health", {
        credentials: "same-origin",
        headers: { "Accept": "application/json" },
        signal: ctrl ? ctrl.signal : undefined
      }).then(function (res) {
        return res.text().then(function (text) {
          return { res: res, text: text };
        });
      }).then(function (pack) {
        clearTimeout(timer);
        var ct = pack.res.headers.get("content-type") || "";
        if (looksAccess(pack.text, ct)) {
          setConn(false, "未过 Cloudflare Access，请先登录域名门禁");
          return;
        }
        try {
          var body = JSON.parse(pack.text);
          if (body && body.ok === true) {
            var cur = (document.getElementById("connText") || {}).textContent || "";
            if (cur.indexOf("连接中") >= 0) setConn(true, "已连接");
            return;
          }
        } catch (e) {}
        var cur2 = (document.getElementById("connText") || {}).textContent || "";
        if (cur2.indexOf("连接中") >= 0) setConn(false, "接口异常：未返回健康 JSON");
      }).catch(function (err) {
        clearTimeout(timer);
        var cur = (document.getElementById("connText") || {}).textContent || "";
        if (cur.indexOf("连接中") < 0) return;
        if (err && err.name === "AbortError") setConn(false, "连接超时");
        else setConn(false, "连接失败：" + (err && err.message ? err.message : "network"));
      });
    })();
  </script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/shell.js"></script>

  <script src="/static/library.js" onerror="(function(){var l=document.getElementById('connText');var d=document.getElementById('connDot');if(d)d.className='dot bad';if(l)l.textContent='脚本加载失败（域名门禁或网络）；可改用内网 http://192.168.5.36:8787/';})()"></script>

</body>
</html>
